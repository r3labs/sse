
name: "Code Quality"

# Trigger the workflow on push or pull request, but only for the master branch
on:
  push: { branches: [master] }
  pull_request: {}


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}


jobs:

  pre-commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: false
          cache-dependency-path: grid-backend/go.sum

      - uses: ./.github/actions/git-crypt
        with:
          git-crypt-key: ${{ secrets.GIT_CRYPT }}

      - uses: actions/cache@v1
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: actions/cache@v3
        with:
          path: lightning-ui/node_modules
          key: cache-${{ runner.os }}-${{ hashFiles('lightning-ui/yarn.lock') }}
      - name: install eslint
        working-directory: ./lightning-ui
        run: yarn install --prefer-offline --frozen-lockfile
      - name: install gotools
        run: go install golang.org/x/tools/cmd/goimports@latest

      - uses: pre-commit/action@v3.0.0

